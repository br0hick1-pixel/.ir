<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<title>PROJECT 180</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"PROJECT 180","short_name":"P180","display":"standalone","dir":"rtl","lang":"fa","background_color":"%2308090B","theme_color":"%2308090B","start_url":"."}'>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090B;--card:#111317;--ash:#1B1D20;--ink:#F2EEE5;--gold:#D6B77A;--pale:#F0D9A3;--mut:#AEB5B0;--sage:#8FA58D;--rose:#B98287;--line:rgba(242,238,229,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg) radial-gradient(ellipse at 50% -8%,rgba(214,183,122,.08),transparent 55%) no-repeat;color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:16px 16px 130px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pale);outline-offset:2px}
h2{font-size:20px;font-weight:900}
.lbl{font-size:12px;color:var(--mut)}
.card{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brand{font:800 13px Vazirmatn,sans-serif;letter-spacing:.3em;color:var(--gold)}
.hero{position:relative;width:min(78vw,300px);margin:8px auto 0}
.hero svg{width:100%;display:block}
.hc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hc small{font-size:12px;letter-spacing:.4em;color:var(--mut);margin-bottom:6px}
.hc b{font-size:clamp(56px,18vw,76px);font-weight:900;letter-spacing:-.02em}
.hc span{margin-top:8px;color:var(--gold);font-weight:600}
.sc{text-align:center;margin:8px 0 20px}.sc b{font-size:34px;font-weight:900;color:var(--pale);margin:0 8px}.sc span{color:var(--mut)}
.bar{height:6px;background:var(--ash);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.rw2{display:flex;justify-content:space-between;align-items:center}.rw2 b{display:block;font-weight:800;font-size:16px}
.pc{font-weight:900;font-size:20px;color:var(--gold)}.pc.ok{color:var(--sage)}
.cod{text-align:center;border-color:rgba(214,183,122,.22)}
.big{font-size:64px;font-weight:900;line-height:1.1;color:var(--gold)}.big small{font-size:16px;color:var(--mut);margin-inline-start:8px;font-weight:600}
.mis{text-align:center;padding:24px 16px;border-color:rgba(214,183,122,.22);background:linear-gradient(180deg,#14161a,var(--card))}
.mis h3{font-size:22px;font-weight:900;margin:8px 0 4px}.mis p{color:var(--mut);margin-bottom:12px}
.xpt{color:var(--pale);font-weight:800;margin-bottom:16px;display:block}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:16px;background:var(--gold);color:#08090B;font-weight:900;font-size:16px;box-shadow:0 6px 20px -10px rgba(214,183,122,.6);transition:transform .2s,background .3s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:10px}
.btn.done{background:rgba(143,165,141,.16);color:var(--sage);box-shadow:none}
.btn.warn{background:var(--rose)}
.rs{border-color:rgba(185,130,135,.35)}.rs b{color:var(--rose);letter-spacing:.08em}.rs p{color:var(--mut)}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,calc(50% - 264px));width:56px;height:56px;border-radius:18px;border:0;background:var(--gold);color:#08090B;display:grid;place-items:center;box-shadow:0 8px 24px -10px rgba(214,183,122,.7);z-index:9}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:flex;background:rgba(17,19,23,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{flex:1;min-height:52px;background:none;border:0;color:var(--mut);opacity:.65;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;position:relative;transition:opacity .25s,color .25s}
.nav svg{width:24px;height:24px;transition:transform .25s}
.nav .a{color:var(--gold);opacity:1}.nav .a svg{transform:scale(1.15)}.nav .a::after{content:"";position:absolute;top:-9px;width:22px;height:2px;border-radius:2px;background:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:20}.ov.o{display:block}
.sh{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:min(100%,560px);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));transition:transform .35s cubic-bezier(.2,.9,.3,1);z-index:21;outline:0}
.sh.o{transform:translate(-50%,0)}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{width:44px;height:44px;border:0;background:var(--ash);border-radius:14px;font-size:22px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.ck{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--mut);display:grid;place-items:center;flex:none;transition:all .25s}
.ck svg{width:16px;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.row.on .ck{background:var(--sage);border-color:var(--sage);box-shadow:0 0 14px -2px rgba(143,165,141,.55)}.row.on .ck svg{transform:scale(1)}
.row .tx{transition:color .3s}.row.on .tx{color:var(--mut)}.row:active .ck{transform:scale(.92)}
input,textarea{width:100%;background:var(--ash);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:10px 12px;font:inherit;margin:4px 0 14px;min-height:48px}
input[type=range]{padding:0;accent-color:var(--gold);margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{min-height:44px;min-width:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:none;transition:all .2s}
.chip.on{background:var(--gold);color:#08090B;border-color:var(--gold);font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.tiles .card{margin:0}
.tiles b{display:block;font-size:30px;font-weight:900;line-height:1.3}.tiles b small{font-size:13px;color:var(--mut);font-weight:600}
.cb{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:10px;margin:8px 0}.cb .bar{margin:0}.cb em{font-style:normal;color:var(--mut);font-size:12px;text-align:end}
.tl{position:relative;height:2px;background:var(--ash);margin:22px 6px 12px}
.tl i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold)}
.tl b{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--gold);margin-inline-start:-6px;box-shadow:0 0 0 4px rgba(214,183,122,.16)}
.tl2{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.hm{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;direction:rtl}
.hm button{aspect-ratio:1;border:0;border-radius:7px;background:var(--ash);transition:transform .2s}
.hm .g{background:var(--gold)}.hm .s{background:var(--sage)}.hm .r{background:var(--rose);opacity:.75}.hm .t{outline:2px solid var(--ink);outline-offset:1px}.hm button:active{transform:scale(1.2)}
.leg{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:12px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.xp{position:fixed;top:32%;left:50%;color:var(--pale);font-weight:900;font-size:28px;animation:xp .7s both;pointer-events:none;z-index:40}
.dc{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,9,11,.88);z-index:30;text-align:center}.dc.o{display:grid}
.dc div{border:1px solid rgba(214,183,122,.4);border-radius:24px;padding:36px 48px;box-shadow:0 0 60px -20px rgba(214,183,122,.5);animation:up .4s both}
.dc b{display:block;font-size:56px;color:var(--gold);line-height:1.2}
.ls{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:56px}.ls p{color:var(--mut);font-size:13px}
.empty{color:var(--mut);text-align:center;padding:16px 0;white-space:pre-line}
.dots{font-size:28px;letter-spacing:.2em;color:var(--sage);margin:6px 0}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{width:0}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
@keyframes sy{from{transform:scaleY(0)}}
@keyframes xp{0%{opacity:0;transform:translate(-50%,10px)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.fx .h1{animation:up .45s .15s both}.fx .h2{animation:up .45s .25s both}
.fx .rg{animation:ring 1s .4s cubic-bezier(.2,.8,.2,1) both}
.fx .st{animation:up .45s both;animation-delay:calc(550ms + var(--i,0)*80ms)}
.fx .bar i{animation:grow .9s .4s cubic-bezier(.2,.8,.2,1) both}
.fx .bb{transform-box:fill-box;transform-origin:bottom;animation:sy .8s .3s both}
body.rm *,body.rm *::before{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<button class="fab" aria-label="یادداشت شبانه" onclick="openJournal()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
<nav class="nav" aria-label="ناوبری اصلی">
<button data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>امروز</button>
<button data-t="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>پیشرفت</button>
<button data-t="missions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></svg>ماموریت</button>
<button data-t="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>بیشتر</button>
</nav>
<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sh" id="sh" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="dc" id="dc" onclick="this.classList.remove('o')" role="alert"></div>
<script>
const KEY='project180.v1';
const CATS={study:'مطالعه',fitness:'تمرین',spiritual:'معنوی',character:'اخلاق',skill:'مهارت',discipline:'انضباط'};
const W={study:30,fitness:20,spiritual:20,character:12,skill:8,discipline:10};
const PR={study:1,fitness:1,spiritual:2,character:3,skill:4,discipline:5};
const XPT={study:30,fitness:30,spiritual:0,character:10,skill:10,discipline:10};
const CK={s:'study',f:'fitness',p:'spiritual',c:'character',k:'skill',d:'discipline'};
const TASKS={
study:[['s1','مطالعه عمیق درسی'],['s2','یادگیری متمرکز بدون گوشی'],['s3','مرور مطالب دیروز']],
fitness:[['f1','تمرین امروز'],['f2','خواب منظم و به‌موقع']],
spiritual:[['p1','نمازها و واجبات'],['p2','پرهیز از گناه و عادت بد'],['p3','محاسبه نفس و توبه'],['p4','قرآن یا مطالعه دینی'],['p5','یک کار خیر پنهان']],
character:[['c1','تمرین صفت هفته'],['c2','پرهیز از غیبت'],['c3','وفای به قول']],
skill:[['k1','مطالعه کتاب'],['k2','یادگیری مهارت یا زبان'],['k3','حفظ یک شعر یا آیه']],
discipline:[['d1','بدون Call of Duty'],['d2','بدون اسکرول بی‌هدف'],['d3','بدون تعویق کار']]};
const MIS=[['مهار واکنش','پیش از پاسخ در لحظه خشم، پنج ثانیه مکث کن.'],['سی دقیقه تمرکز','سی دقیقه مطالعه عمیق، بدون گوشی.'],['تمرین صبر','امروز یک بار در برابر ناخوشایندی صبر کن.'],['نیکی پنهان','کاری خیر انجام بده که کسی متوجه نشود.'],['حفظ تازه','یک آیه یا شعر تازه حفظ کن.'],['یاری بی‌چشم‌داشت','به کسی کمک کن، بی‌انتظار پاسخ.'],['ترک یک عادت','امروز یک عادت بد مشخص را کنار بگذار.'],['بیست دقیقه کتاب','بیست دقیقه کتاب بخوان.'],['حتی بی‌انگیزه','تمرینت را بی‌توجه به حال و هوا انجام بده.'],['گوش دادن','کمتر حرف بزن و بیشتر گوش کن.'],['سپاس','سه چیزی را که بابتش سپاسگزاری بنویس.'],['وفا','به قولی که داده‌ای عمل کن.']];
const TRAITS=[['صبر',['وسط حرف کسی نپر.','پیش از واکنش مکث کن.']],['فروتنی',['از کسی چیزی یاد بگیر.','اشتباهت را بی‌بهانه بپذیر.']],['صداقت',['حتی یک دروغ کوچک هم نگو.','حرف دلت را محترمانه بگو.']],['سپاس',['شب سه نعمت را بنویس.','از یک نفر تشکر کن.']],['انضباط',['کار سخت را اول انجام بده.','سر وقت شروع کن.']],['مهربانی',['یک جمله محبت‌آمیز بگو.','کمکی کوچک بکن.']],['وفای به عهد',['به هر قول عمل کن.','قول نده مگر مطمئن باشی.']],['مهار خشم',['وقتی عصبانی شدی نفس بکش.','پاسخ تند نده.']],['کم‌گویی',['کمتر حرف بزن.','پیش از گفتن بسنج.']],['احترام',['بی‌قطع‌کردن گوش بده.','با همه محترمانه حرف بزن.']]];
const WM=['مرور هفتگی','شناسایی نقطه‌ضعف','چالش اخلاقی هفته','جبران عقب‌ماندگی درسی','مرور یادگیری'];
const TH=[0,300,900,1800,3200,5000,7500,10500,14000,18000],LN=['آغاز','پایداری','انضباط','استواری','تمرکز','عمق','تسلط','بلوغ','اوج','نسخه نو'];
const CHK='<svg viewBox="0 0 16 16" fill="none" stroke="#08090B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pd=s=>new Date(s+'T00:00:00');
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const pad=n=>String(n).padStart(3,'0');
const fmt=s=>{try{return pd(s).toLocaleDateString('fa-IR-u-ca-gregory-nu-latn',{day:'numeric',month:'long'})}catch(e){return s}};

/* ---------- data layer (swap load/save for a backend later) ---------- */
const def=()=>({v:1,set:{start:'2026-10-01',len:180,rm:false,target:5},days:{},goals:[],study:[],fit:{},weeks:{},wm:{}});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.set&&r.days){const d=Object.assign(def(),r);d.set=Object.assign(def().set,r.set);return d}}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),tab='today',T=ds(new Date()),tm={};
const idx=s=>Math.round((pd(s)-pd(S.set.start))/864e5)+1;
const dayAt=i=>add(S.set.start,i-1);
const tk=s=>(S.days[s]||{}).t||{};
const dset=s=>S.days[s]=S.days[s]||{t:{}};
const pct=(c,s)=>TASKS[c].filter(x=>tk(s)[x[0]]).length/TASKS[c].length;
const score=s=>Math.round(Object.keys(W).reduce((a,c)=>a+W[c]*pct(c,s),0));
const hasData=s=>Object.values(tk(s)).some(Boolean);
const solid=s=>score(s)>=60, cod=s=>!!tk(s).d1;
const dayXp=s=>{const d=S.days[s];if(!d)return 0;let x=0;for(const k in d.t)if(d.t[k])x+=XPT[CK[k[0]]];if(d.m)x+=50;if(score(s)==100)x+=50;return x};
const totalXp=()=>Object.keys(S.days).reduce((a,s)=>a+dayXp(s),0)+Object.values(S.wm).reduce((a,o)=>a+Object.values(o).filter(Boolean).length*20,0);
function lvl(){const x=totalXp();let n=0;TH.forEach((t,i)=>{if(x>=t)n=i});return{n:n+1,name:LN[n],x,from:TH[n],to:TH[n+1]||TH[n]}}
function streakOf(fn){let d=T,n=0;if(!fn(d))d=add(d,-1);while(S.days[d]&&fn(d)){n++;d=add(d,-1)}return n}
function bestOf(fn){let b=0,c=0;for(let i=1;i<=Math.min(idx(T),S.set.len);i++){fn(dayAt(i))?b=Math.max(b,++c):c=0}return b}
const recorded=()=>{const a=[];for(let i=1;i<=Math.min(idx(T),S.set.len);i++){const s=dayAt(i);if(hasData(s))a.push(s)}return a};
const catAvg=c=>{const r=recorded();return r.length?Math.round(r.reduce((a,s)=>a+pct(c,s),0)/r.length*100):0};
const wkNo=s=>Math.floor((idx(s)-1)/7)+1;

/* ---------- views ---------- */
function missionCard(){const m=MIS[(Math.max(1,idx(T))-1)%MIS.length],d=(S.days[T]||{}).m;
return `<section class="card mis st" style="--i:5"><span class=lbl>ماموریت امروز</span><h3>${m[0]}</h3><p>«${m[1]}»</p>${d?'<span class=xpt>+50 XP</span><button class="btn done" disabled>✓ ماموریت انجام شد</button>':'<span class=xpt>+50 XP</span><button class=btn onclick="doMission()">انجام شد ✓</button>'}</section>`}
function vToday(){
const L=S.set.len,i=Math.max(1,Math.min(L,idx(T))),sc=score(T),y=add(T,-1),lv=lvl();
const c1=2*Math.PI*98,c2=2*Math.PI*82,rs=idx(T)>1&&idx(y)<=L&&!solid(y);
const cc=(c,n)=>{const p=Math.round(pct(c,T)*100),k=TASKS[c].filter(x=>tk(T)[x[0]]).length;return `<button class="card st" style="--i:${n}" onclick="openTasks('${c}')"><div class=rw2><div><b>${CATS[c]}</b><span class=lbl>اولویت ${PR[c]} · ${k} از ${TASKS[c].length}</span></div><span class="pc ${p==100?'ok':''}">${p==100?'✓':p+'%'}</span></div><div class=bar><i style="width:${p}%"></i></div></button>`};
return `<header class="top h1"><span class=brand>PROJECT 180</span><span class=lbl>${fmt(T)} · سطح ${lv.n} ${lv.name}</span></header>
<div class="hero"><svg viewBox="0 0 220 220" aria-hidden="true"><g transform="rotate(-90 110 110)" fill="none"><circle cx=110 cy=110 r=98 stroke="var(--ash)" stroke-width=2 /><circle class=rg cx=110 cy=110 r=98 stroke="var(--ink)" stroke-opacity=".55" stroke-width=2 stroke-dasharray="${c1}" stroke-dashoffset="${c1*(1-i/L)}" style="--c:${c1}"/><circle cx=110 cy=110 r=82 stroke="var(--ash)" stroke-width=9 /><circle class=rg cx=110 cy=110 r=82 stroke="var(--gold)" stroke-width=9 stroke-dasharray="${c2}" stroke-dashoffset="${c2*(1-sc/100)}" style="--c:${c2}"/></g></svg>
<div class="hc h2" role="img" aria-label="روز ${i} از ${L}"><small>DAY</small><b>${pad(i)}</b><span>${i} / ${L}</span></div></div>
<p class="sc h2"><span class=lbl>امتیاز امروز</span><b>${sc}</b><span>/ 100</span></p>
${rs?`<section class="card rs st" style="--i:0"><b>DAY ${pad(i)} — RESET</b><p>دیروز تمام شد. امروز هنوز از آنِ توست.</p></section>`:''}
${['study','fitness','spiritual','character','skill'].map(cc).join('')}
<button class="card cod st" style="--i:5" onclick="openTasks('discipline')"><span class=lbl>COD FREE</span><div class=big>${streakOf(cod)}<small>روز</small></div><span class=lbl>بهترین رکورد: ${bestOf(cod)} روز · انضباط دیجیتال ${Math.round(pct('discipline',T)*100)}%</span></button>
${missionCard()}
<button class="btn sec st" style="--i:6" onclick="finishDay()">پایان روز</button>`}

function radar(){const ks=['study','fitness','spiritual','character','discipline','skill'],cx=130,cy=120,R=78;
const pt=(k,r)=>{const a=-Math.PI/2+k*Math.PI/3;return[(cx+Math.cos(a)*R*r).toFixed(1),(cy+Math.sin(a)*R*r).toFixed(1)]};
const poly=r=>ks.map((_,k)=>pt(k,typeof r=='function'?r(k):r).join(',')).join(' ');
const has=recorded().length>0;
return `<svg viewBox="0 0 260 240" width="100%" role="img" aria-label="نمودار رادار رشد">${[.33,.66,1].map(r=>`<polygon points="${poly(r)}" fill="none" stroke="var(--line)"/>`).join('')}${ks.map((_,k)=>`<line x1=${cx} y1=${cy} x2=${pt(k,1)[0]} y2=${pt(k,1)[1]} stroke="var(--line)"/>`).join('')}${has?`<polygon points="${poly(k=>Math.max(.03,catAvg(ks[k])/100))}" fill="rgba(214,183,122,.18)" stroke="var(--gold)" stroke-width="1.5"/>`:''}${ks.map((c,k)=>{const p=pt(k,1.3);return `<text x=${p[0]} y=${p[1]} fill="var(--mut)" font-size="11" text-anchor="middle" dominant-baseline="middle">${CATS[c]}</text>`}).join('')}</svg>`}

function vProg(){
const L=S.set.len,i=Math.max(1,Math.min(L,idx(T))),lv=lvl(),rec=recorded(),sd=rec.filter(solid).length;
const avg=rec.length?Math.round(rec.reduce((a,s)=>a+score(s),0)/rec.length):0;
const bars=[...Array(7)].map((_,k)=>{const s=add(T,k-6),v=score(s),h=Math.max(3,v*.8);return `<rect class=bb x=${k*42+10} y=${95-h} width=26 height=${h} rx=6 fill="${!hasData(s)?'var(--ash)':v>=85?'var(--gold)':v>=60?'var(--sage)':'var(--rose)'}"/><text x=${k*42+23} y=112 fill="var(--mut)" font-size=10 text-anchor=middle>${Math.max(0,idx(s))||'·'}</text>`}).join('');
let hm='';for(let n=1;n<=L;n++){const s=dayAt(n),f=s>T,v=score(s),c=f?'':!hasData(s)?'r':v>=85?'g':v>=60?'s':'r';hm+=`<button class="${c} ${s==T?'t':''}" aria-label="روز ${n}" onclick="openDay(${n})"></button>`}
const pctL=((i-1)/Math.max(1,L-1))*100,tail=pd(dayAt(L)).toLocaleDateString('en-US',{month:'short',day:'2-digit'}).toUpperCase(),head=pd(S.set.start).toLocaleDateString('en-US',{month:'short',day:'2-digit'}).toUpperCase();
return `<header class="top h1"><h2>پیشرفت</h2></header>
<section class="card"><div class=rw2><div><span class=lbl>LEVEL ${String(lv.n).padStart(2,'0')}</span><b style="font-size:20px">${lv.name}</b></div><span class=pc>${lv.x} XP</span></div><div class=bar><i style="width:${lv.to>lv.from?(lv.x-lv.from)/(lv.to-lv.from)*100:100}%"></i></div></section>
<div class=tiles><div class=card><span class=lbl>روزهای موفق</span><b>${sd}<small> / ${L}</small></b></div><div class=card><span class=lbl>میانگین امتیاز</span><b>${avg}</b></div><div class=card><span class=lbl>رشته فعلی</span><b>${streakOf(solid)}<small> روز</small></b></div><div class=card><span class=lbl>بهترین رشته</span><b>${bestOf(solid)}<small> روز</small></b></div></div>
<section class=card><span class=lbl>مسیر ۱۸۰ روزه</span><div class=tl><i style="width:${pctL}%"></i><b style="inset-inline-start:${pctL}%"></b></div><div class=tl2><span>${head}</span><span style="color:var(--gold);font-weight:800">DAY ${pad(i)}</span><span>${tail}</span></div></section>
<section class=card><span class=lbl>۷ روز اخیر</span><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="نمودار امتیاز هفت روز اخیر">${bars}</svg></section>
<section class=card><span class=lbl>عملکرد دسته‌ها</span>${Object.keys(CATS).map(c=>`<div class=cb><span>${CATS[c]}</span><div class=bar><i style="width:${catAvg(c)}%"></i></div><em>${catAvg(c)}%</em></div>`).join('')}</section>
<section class=card><span class=lbl>در حال تبدیل شدن به چه کسی هستم؟</span>${radar()}${rec.length?'':'<p class=empty>سفر تو از امروز شروع می‌شود.</p>'}</section>
<section class=card><span class=lbl>تقویم سفر</span><div class=hm style="margin-top:12px">${hm}</div><div class=leg><span><i style="background:var(--gold)"></i>روز قوی</span><span><i style="background:var(--sage)"></i>انجام‌شده</span><span><i style="background:var(--rose)"></i>ناقص</span><span><i style="background:var(--ash)"></i>پیش رو</span></div></section>`}

function vMis(){const w=wkNo(T),tr=TRAITS[(Math.max(1,w)-1)%10],r=(S.weeks[w]||{}).char,wm=S.wm[w]||{};
return `<header class="top h1"><h2>ماموریت‌ها</h2></header>${missionCard()}
<section class=card><span class=lbl>صفت هفته ${w}</span><h2 style="margin:4px 0 8px">${tr[0]}</h2>${tr[1].map(x=>`<p>• ${x}</p>`).join('')}<p class=lbl style="margin-top:12px">این صفت را چقدر تمرین کردم؟</p>${chips([1,2,3,4,5].map(n=>[n,n]),r,'rateC')}</section>
<section class=card><span class=lbl>ماموریت‌های هفتگی · هر کدام +20 XP</span>${WM.map((t,k)=>`<button class="row ${wm[k]?'on':''}" role=checkbox aria-checked="${!!wm[k]}" onclick="wmt(${k},this)"><span class=ck>${CHK}</span><span class=tx>${t}</span></button>`).join('')}</section>`}

function vMore(){const it=[['یادداشت شبانه','سه پرسش ساده برای پایان روز','openJournal()'],['اهداف','هدف‌های بلندمدت','openGoals()'],['مطالعه','درس‌ها، زمان، مرور و تایمر تمرکز','openStudy()'],['تمرین','هدف هفتگی و ثبت جلسه‌ها','openFit()'],['مرور هفتگی','چه بهتر شد؟ هفته بعد چه؟','openWeek(wkNo(T))'],['تنظیمات و پشتیبان','تاریخ شروع، حرکت، خروجی و بازیابی','openSet()']];
return `<header class="top h1"><h2>بیشتر</h2></header>${it.map(x=>`<button class="card ls" onclick="${x[2]}"><div><b>${x[0]}</b><p>${x[1]}</p></div><span class=lbl>‹</span></button>`).join('')}`}

function render(a){const v=$('#view');v.className=a?'fx':'';v.innerHTML=({today:vToday,progress:vProg,missions:vMis,more:vMore})[tab]();document.body.classList.toggle('rm',!!S.set.rm);document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.t===tab;b.classList.toggle('a',on);b.setAttribute('aria-current',on?'page':'false')})}

/* ---------- helpers ---------- */
function sheet(t,h){$('#sh').innerHTML=`<div class=sh-h><h2>${t}</h2><button class=x aria-label="بستن" onclick="closeSheet()">×</button></div>${h}`;$('#ov').classList.add('o');$('#sh').classList.add('o');$('#sh').focus()}
function closeSheet(){$('#ov').classList.remove('o');$('#sh').classList.remove('o')}
function toast(t){const e=document.createElement('div');e.className='xp';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),750)}
function sel(b){[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x==b))}
const chips=(o,cur,fn)=>`<div class=chips role=group>${o.map(x=>`<button class="chip ${cur==x[0]?'on':''}" onclick="${fn}('${x[0]}');sel(this)">${x[1]}</button>`).join('')}</div>`;

/* ---------- actions ---------- */
function openTasks(c){const t=tk(T);sheet(CATS[c],(c=='spiritual'?'<p class=lbl>این بخش بی‌امتیاز و بی‌XP است؛ فقط برای خودت.</p>':'')+TASKS[c].map(x=>`<button class="row ${t[x[0]]?'on':''}" role=checkbox aria-checked="${!!t[x[0]]}" onclick="tg('${x[0]}',this)"><span class=ck>${CHK}</span><span class=tx>${x[1]}</span></button>`).join(''))}
function tg(id,el){const d=dset(T);d.t[id]=!d.t[id];save();const on=!!d.t[id];el.classList.toggle('on',on);el.setAttribute('aria-checked',on);const x=XPT[CK[id[0]]];if(on&&x)toast('+'+x+' XP');render()}
function doMission(){const d=dset(T);if(d.m)return;d.m=1;save();toast('+50 XP');render()}
function finishDay(){dset(T).fin=1;save();const x=dayXp(T);$('#dc').innerHTML=`<div><b>✓</b><h2>روز کامل شد</h2><p style="color:var(--pale);font-weight:800">${x} XP</p></div>`;$('#dc').classList.add('o')}
function wmt(k,el){const w=wkNo(T);S.wm[w]=S.wm[w]||{};S.wm[w][k]=!S.wm[w][k];save();el.classList.toggle('on',S.wm[w][k]);if(S.wm[w][k])toast('+20 XP')}
function wset(n,k,v){S.weeks[n]=S.weeks[n]||{};S.weeks[n][k]=v;save()}
const rateC=v=>wset(wkNo(T),'char',+v);

function jset(k,v){const d=dset(T);d.j=d.j||{};d.j[k]=v;save()}
function openJournal(){const j=(S.days[T]||{}).j||{},Q=['چه کاری امروز خوب انجام دادم؟','کجا ضعف یا بی‌تمرکزی داشتم؟','فردا چه چیزی را بهتر می‌کنم؟'];
const past=Object.keys(S.days).filter(s=>s!=T&&S.days[s].j&&(S.days[s].j.a||S.days[s].j.b||S.days[s].j.c)).sort().reverse().slice(0,5);
sheet('یادداشت شبانه',Q.map((q,n)=>`<label class=lbl for=j${n}>${q}</label><textarea id=j${n} rows=2 oninput="jset('${'abc'[n]}',this.value)">${esc(j['abc'[n]])}</textarea>`).join('')+`<span class=lbl>حال</span>${chips([1,2,3,4,5].map(n=>[n,n]),j.m,'jm')}<span class=lbl>انرژی</span>${chips([1,2,3,4,5].map(n=>[n,n]),j.e,'je')}`+`<h2 style="margin:8px 0">قبلی‌ها</h2>`+(past.length?past.map(s=>`<div class=card><span class=lbl>${fmt(s)}</span><p>${esc(S.days[s].j.a||S.days[s].j.b||S.days[s].j.c)}</p></div>`).join(''):'<p class=empty>هنوز چیزی نوشته نشده.\nیک جمله کافی است.</p>'))}
const jm=v=>jset('m',+v),je=v=>jset('e',+v);

function openGoals(){sheet('اهداف',`<input id=gi placeholder="هدف تازه..." maxlength=120><button class=btn onclick="addGoal()">افزودن هدف</button><div style="margin-top:12px">${S.goals.length?S.goals.map(g=>`<div class=ls><button class="row ${g.d?'on':''}" style="border:0" role=checkbox aria-checked="${!!g.d}" onclick="goalT(${g.id})"><span class=ck>${CHK}</span><span class=tx>${esc(g.t)}</span></button><button class=x aria-label="حذف" onclick="goalD(${g.id})">×</button></div>`).join(''):'<p class=empty>اولین هدف سفرت را بنویس.</p>'}</div>`)}
function addGoal(){const v=$('#gi').value.trim();if(!v)return;S.goals.push({id:Date.now(),t:v,d:0});save();openGoals()}
function goalT(id){const g=S.goals.find(x=>x.id==id);g.d=!g.d;save();openGoals()}
function goalD(id){S.goals=S.goals.filter(x=>x.id!=id);save();openGoals()}

function st(id,k,v){const s=S.study.find(x=>x.id==id);s[k]=v;save()}
function tick(){const l=Math.max(0,Math.ceil((tm.end-Date.now())/1e3)),e=$('#tm');if(e)e.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');if(!l){clearInterval(tm.id);tm.id=0;const s=S.study.find(x=>x.id==tm.sid);if(s){s.a=(+s.a||0)+25;save()}toast('+25 دقیقه');if($('#sh').classList.contains('o'))openStudy()}}
function startT(){if(tm.id){clearInterval(tm.id);tm.id=0;return openStudy()}tm.sid=$('#ts').value;tm.end=Date.now()+1500e3;tm.id=setInterval(tick,1000);openStudy()}
function openStudy(){const sel2=tm.sid||(S.study[0]||{}).id;
sheet('مطالعه',`<section class=card><span class=lbl>تایمر تمرکز ۲۵ دقیقه‌ای</span><div class=big id=tm style="font-size:48px">25:00</div>${S.study.length?`<select id=ts style="width:100%;min-height:48px;background:var(--ash);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0 10px;margin:8px 0">${S.study.map(s=>`<option value=${s.id} ${s.id==sel2?'selected':''}>${esc(s.n)}</option>`).join('')}</select><button class=btn onclick="startT()">${tm.id?'توقف':'شروع تمرکز'}</button>`:'<p class=empty>برای استفاده از تایمر، یک درس اضافه کن.</p>'}</section>`+
S.study.map(s=>`<section class=card><div class=rw2><b>${esc(s.n)}</b><b class=pc>${s.pr||0}%</b></div><p class=lbl>${esc(s.g||'')}</p><input type=range min=0 max=100 value="${s.pr||0}" aria-label="پیشرفت" oninput="st(${s.id},'pr',+this.value);this.parentNode.querySelector('.pc').textContent=this.value+'%'"><div class=bar style="margin-bottom:12px"><i style="width:${s.pr||0}%"></i></div>
<label class=lbl>زمان برنامه‌ریزی‌شده / واقعی (دقیقه)</label><div style="display:flex;gap:8px"><input type=number min=0 value="${s.p||0}" onchange="st(${s.id},'p',+this.value)"><input type=number min=0 value="${s.a||0}" onchange="st(${s.id},'a',+this.value)"></div>
<label class=lbl>مرور بعدی</label><input type=date value="${s.r||''}" onchange="st(${s.id},'r',this.value)"><label class=lbl>یادداشت</label><textarea rows=2 oninput="st(${s.id},'no',this.value)">${esc(s.no||'')}</textarea><button class="btn sec" onclick="if(!this.dataset.c){this.dataset.c=1;this.textContent='تأیید حذف';return}S.study=S.study.filter(x=>x.id!=${s.id});save();openStudy()">حذف درس</button></section>`).join('')+
`<section class=card><b>درس تازه</b><input id=sn placeholder="نام درس (مثلاً تفسیر)" maxlength=60><input id=sg placeholder="هدف" maxlength=100><button class=btn onclick="addS()">افزودن درس</button></section>`)}
function addS(){const n=$('#sn').value.trim();if(!n)return;S.study.push({id:Date.now(),n,g:$('#sg').value.trim(),p:0,a:0,pr:0,r:'',no:''});save();openStudy()}

function wkCount(){const w=wkNo(T)-1;let n=0;for(let k=0;k<7;k++)if(S.fit[add(S.set.start,w*7+k)])n++;return n}
function openFit(){const n=wkCount(),g=S.set.target,f=S.fit[T]||{},last=Object.keys(S.fit).sort().reverse().slice(0,5);
sheet('تمرین',`<section class=card><span class=lbl>هدف هفتگی</span><div class=dots>${[...Array(Math.max(g,n))].map((_,k)=>k<n?'✓':'○').join(' ')}</div><b>${n} / ${g} جلسه</b></section><label class=lbl>مدت (دقیقه)</label><input id=fd type=number min=0 value="${f.dur||''}"><label class=lbl>حرکات (اختیاری)</label><textarea id=fe rows=2>${esc(f.ex||'')}</textarea><button class=btn onclick="logFit()">ثبت تمرین امروز</button><h2 style="margin:16px 0 4px">اخیر</h2>${last.length?last.map(s=>`<div class=ls><span>${fmt(s)}</span><span class=lbl>${S.fit[s].dur||0} دقیقه · ${esc(S.fit[s].ex||'')}</span></div>`).join(''):'<p class=empty>هنوز تمرینی ثبت نشده.</p>'}`)}
function logFit(){S.fit[T]={dur:+$('#fd').value||0,ex:$('#fe').value.trim()};dset(T).t.f1=true;save();toast('+30 XP');render();openFit()}

function openWeek(n){const L=Math.ceil(S.set.len/7);n=Math.max(1,Math.min(L,n));const w=S.weeks[n]||{};
const ds2=[...Array(7)].map((_,k)=>add(S.set.start,(n-1)*7+k)).filter(s=>s<=T&&hasData(s)),avg=ds2.length?Math.round(ds2.reduce((a,s)=>a+score(s),0)/ds2.length):'—';
sheet(`هفته ${n}`,`<div class=big>${avg}<small> / 100</small></div>`+['چه چیزی بهتر شد؟','چه چیزی خراب شد؟','اولویت هفته بعد چیست؟'].map((q,k)=>`<label class=lbl>${q}</label><textarea rows=2 oninput="wset(${n},'${'abc'[k]}',this.value)">${esc(w['abc'[k]])}</textarea>`).join('')+`<span class=lbl>تمرکز اصلی هفته بعد</span>${chips(Object.keys(CATS).map(c=>[c,CATS[c]]),w.focus,`wf${n}_`)}<div style="display:flex;gap:8px"><button class="btn sec" onclick="openWeek(${n-1})">هفته قبل</button><button class="btn sec" onclick="openWeek(${n+1})">هفته بعد</button></div>`);
window['wf'+n+'_']=v=>wset(n,'focus',v)}

function openDay(n){const s=dayAt(n),d=S.days[s],sc=score(s);
if(s>T)return sheet(`DAY ${pad(n)}`,'<p class=empty>این روز هنوز نرسیده است.</p>');
sheet(`DAY ${pad(n)}`,`<p class=lbl>${fmt(s)}</p><div class=big>${sc}<small>امتیاز</small></div>`+(d&&hasData(s)?Object.keys(CATS).map(c=>`<div class=ls><span>${CATS[c]}</span><b style="color:${pct(c,s)==1?'var(--sage)':'var(--mut)'}">${pct(c,s)==1?'✓':Math.round(pct(c,s)*100)+'%'}</b></div>`).join('')+(d.m?'<div class=ls><span>ماموریت</span><b style="color:var(--sage)">✓</b></div>':'')+(d.j&&(d.j.a||d.j.b||d.j.c)?`<div class=card><span class=lbl>بازتاب</span><p>${esc(d.j.a||d.j.b||d.j.c)}</p></div>`:''):'<p class=empty>برای این روز ثبتی نیست.\nامروز هنوز از آنِ توست.</p>'))}

function setS(k,v){if(!v)return;S.set[k]=v;save();render()}
function tgRm(el){S.set.rm=!S.set.rm;save();el.classList.toggle('on',S.set.rm);el.setAttribute('aria-checked',S.set.rm);render()}
function openSet(){const s=S.set;sheet('تنظیمات',`<label class=lbl for=sd>تاریخ شروع</label><input id=sd type=date value="${s.start}" onchange="setS('start',this.value)"><label class=lbl for=sl>طول سفر (روز)</label><input id=sl type=number min=30 max=400 value="${s.len}" onchange="setS('len',+this.value)"><label class=lbl for=sg2>هدف تمرین هفتگی (جلسه)</label><input id=sg2 type=number min=1 max=7 value="${s.target}" onchange="setS('target',+this.value)"><button class="row ${s.rm?'on':''}" role=switch aria-checked="${!!s.rm}" onclick="tgRm(this)"><span class=ck>${CHK}</span><span class=tx>کاهش حرکت</span></button><p class=lbl style="margin:8px 0">زبان: فارسی · تم: تیره · داده‌ها فقط روی همین دستگاه ذخیره می‌شوند.</p><button class="btn sec" onclick="openBackup()">خروجی، بازیابی و بازنشانی</button>`)}
function openBackup(){sheet('پشتیبان‌گیری',`<button class=btn onclick="exportD()">خروجی گرفتن (JSON)</button><textarea id=bk rows=6 placeholder="متن JSON برای بازیابی را اینجا بچسبان" style="margin-top:12px"></textarea><button class="btn sec" onclick="importD(this)">بازیابی از متن</button><button class="btn sec" style="color:var(--rose)" onclick="resetAsk()">بازنشانی همه داده‌ها</button>`)}
function exportD(){const j=JSON.stringify(S,null,1);$('#bk').value=j;$('#bk').select();try{navigator.clipboard.writeText(j)}catch(e){}try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='project180-'+T+'.json';a.click()}catch(e){}toast('آماده شد')}
function importD(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='با تأیید، داده‌های فعلی جایگزین می‌شوند — دوباره بزن';return}try{const o=JSON.parse($('#bk').value);if(!o.set||!o.days)throw 0;S=Object.assign(def(),o);S.set=Object.assign(def().set,o.set);save();closeSheet();render(true)}catch(e){b.textContent='فایل معتبر نیست';delete b.dataset.c}}
